services:
  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AUDIO_SERVER_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AUDIO_SERVER_S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "${AUDIO_SERVER_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${AUDIO_SERVER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUDIO_SERVER_DB_PASSWORD:-postgres_pwd}
      POSTGRES_DB: ${AUDIO_SERVER_DB_NAME:-audio-server-db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUDIO_SERVER_DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    ports:
      - "${AUDIO_SERVER_PORT:-8000}:8000"
    environment:
      AUDIO_SERVER_PORT: 8000
      AUDIO_SERVER_S3_ENDPOINT_URL: http://minio:9000
      AUDIO_SERVER_S3_ACCESS_KEY: ${AUDIO_SERVER_S3_ACCESS_KEY:-minioadmin}
      AUDIO_SERVER_S3_SECRET_KEY: ${AUDIO_SERVER_S3_SECRET_KEY:-minioadmin}
      AUDIO_SERVER_S3_BUCKET_NAME: ${AUDIO_SERVER_S3_BUCKET_NAME:-audio-files}
      AUDIO_SERVER_DB_HOST: postgres
      AUDIO_SERVER_DB_PORT: 5432
      AUDIO_SERVER_DB_USER: ${AUDIO_SERVER_DB_USER:-postgres}
      AUDIO_SERVER_DB_PASSWORD: ${AUDIO_SERVER_DB_PASSWORD:-postgres_pwd}
      AUDIO_SERVER_DB_NAME: ${AUDIO_SERVER_DB_NAME:-audio-server-db}
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  minio-data:
  postgres-data:
